<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{TITLE}} - LayoverX</title>
  <meta name="description" content="{{DESCRIPTION}}"/>
  <meta name="keywords" content="Mumbai Airport Hotels, Mumbai Airport Restaurants, Mumbai Transit Tours, Mumbai Airport Cabs, Layover Itinerary Planner, LayoverX"/>
  <link rel="canonical" href="{{CANONICAL}}"/>
  <meta property="og:title" content="{{TITLE}} - LayoverX"/>
  <meta property="og:description" content="{{DESCRIPTION}}"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="{{CANONICAL}}"/>
  <meta property="og:image" content="https://layoverx.com/assets/photos/homepage.png"/>
  <meta property="og:site_name" content="LayoverX"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="{{TITLE}} - LayoverX"/>
  <meta name="twitter:description" content="{{DESCRIPTION}}"/>
  {{ROBOTS}}

  <!-- Critical CSS: prevents FOUC & locks design-system type scale before Tailwind -->
  <style>
    :root {
      --font-size-h1: 4rem;             /* 64px — hero heading */
      --font-size-h2: 3rem;             /* 48px — section heading */
      --font-size-h3: 1.75rem;          /* 28px — sub heading */
      --font-size-h4: 1.125rem;         /* 18px — secondary text */
      --font-size-body: 1.0625rem;       /* 17px — body text */
      --font-size-secondary: 1.125rem;   /* 18px — secondary text */
      --font-size-small: 0.875rem;       /* 14px — small text */
      --font-size-caption: 1rem;         /* 16px — caption text */
      --line-height-tight: 1.15;
      --line-height-snug: 1.15;
      --line-height-heading: 1.15;
      --line-height-body: 1.7;
    }

    html { font-size: 16px; box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: var(--font-size-body);
      line-height: var(--line-height-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1 { font-size: clamp(2.125rem, 5vw, var(--font-size-h1)); line-height: var(--line-height-tight); font-weight: 800; letter-spacing: -0.03em; }
    h2 { font-size: clamp(1.75rem, 4vw, var(--font-size-h2)); line-height: var(--line-height-snug); font-weight: 800; letter-spacing: -0.025em; }
    h3 { font-size: var(--font-size-h3); line-height: var(--line-height-heading); font-weight: 700; }
    h4 { font-size: var(--font-size-h4); line-height: var(--line-height-heading); font-weight: 600; }
    h5 { font-size: var(--font-size-body); line-height: var(--line-height-body); font-weight: 600; }
    h6 { font-size: var(--font-size-small); line-height: var(--line-height-body); font-weight: 600; }

    p { font-size: var(--font-size-body); line-height: var(--line-height-body); }

    input, select, textarea, button { font-family: inherit; font-size: var(--font-size-small); }

    .container { width: 100%; max-width: 80rem; margin: 0 auto; padding: 0 1rem; }

    body { visibility: visible; }
  </style>

  <!-- Inter font — weights 300-900 for full design range -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preload"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    as="style"/>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"/>
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  </noscript>

  <!-- Tailwind utility classes -->
  <link rel="preload" href="css/tailwind.min.css" as="style"/>
  <link rel="stylesheet" href="css/tailwind.min.css"/>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-init.js" type="module"></script>

  <!-- LayoverX Design System (overrides Tailwind where needed) -->
  <link rel="stylesheet" href="css/design-system.css?v=20260720a"/>

  <!-- Global Structure & Typography Overrides (loads last — highest priority) -->
  <link rel="stylesheet" href="css/global-overrides.css?v=20260720a"/>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>

  <!-- Map Config -->
  <script src="js/map-config.js" defer></script>

  <!-- App JS -->
  <script src="js/app.js" defer></script>

  <!-- Google Maps JS SDK -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=places" defer></script>

  {{JSON_LD}}
</head>
